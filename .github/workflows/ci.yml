name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      # The committed eval results against the pinned baseline (M4-A). Offline: no model call.
      - run: uv run python -m owl_mind.evaluation.check_baseline

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://owl:owl_dev@localhost:5433/owl
      REDIS_URL: redis://localhost:6380/0
      # The integration tests replace the network layer, so this is never sent anywhere.
      DEEPSEEK_API_KEY: not-a-real-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: docker compose up -d --wait
      - run: uv run pytest -m integration

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
      - run: uv sync --locked
      - run: docker compose up -d --wait postgres redis
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web

[project]
name = "owl-mind-harness"
version = "0.1.0"
description = "A multi-agent study assistant built on DeepAgents"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=23.1",
    "deepagents>=0.7,<0.8",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-deepseek>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "pgvector>=0.4",
    "pyjwt>=2.10",
    "prometheus-client>=0.22",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.10",
    "redis>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-socket>=0.7",
    "pytest-timeout>=2.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owl_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
addopts = "--disable-socket --allow-unix-socket -m 'not integration and not live'"
markers = [
    "integration: needs the compose services",
    "live: calls the DeepSeek API and costs a small amount",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Local development services. The password is for this local database only.
name: owl-mind-harness

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: owl
      POSTGRES_PASSWORD: owl_dev
      POSTGRES_DB: owl
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owl -d owl"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  redis_data:

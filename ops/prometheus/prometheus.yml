global:
  scrape_interval: 5s

# Each process serves its own /metrics (M4-E). Workers on one host use ports 9101, 9102, ...
scrape_configs:
  - job_name: owl-mind-api
    static_configs:
      - targets: ["host.docker.internal:8010"]
  - job_name: owl-mind-workers
    static_configs:
      - targets: ["host.docker.internal:9101", "host.docker.internal:9102"]
